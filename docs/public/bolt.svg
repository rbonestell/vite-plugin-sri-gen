<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="45%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="sheen" cx="38%" cy="32%" r="55%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Rounded-square badge -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#badge)"/>
  <!-- Highlight sheen -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#sheen)"/>
  <!-- Lightning bolt — chunky, centered -->
  <path d="M74 14 L34 68 h24 L46 114 L94 58 H68 Z" fill="url(#bolt)" filter="url(#glow)"/>
</svg>
